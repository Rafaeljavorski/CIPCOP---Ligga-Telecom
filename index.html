<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ativo Clientes - Ligga</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<div class="container">
  <h1>📊 Ativo de Clientes</h1>

  <div class="top-bar">
    <input id="buscaContrato" placeholder="🔍 Buscar contrato..." oninput="filtrarPorContrato()">
    <button onclick="abrirAbaWhatsApp()">🟢 WhatsApp</button>
  </div>

  <div class="cards">
    <div class="card aguardando">Aguardando <span id="contAguardando">0</span></div>
    <div class="card confirmado">Confirmado <span id="contConfirmado">0</span></div>
    <div class="card reagendado">Reagendado <span id="contReagendado">0</span></div>
    <div class="card cancelado">Cancelado <span id="contCancelado">0</span></div>
  </div>

  <div class="form">
    <input id="cliente" placeholder="Cliente">
    <input id="celular" placeholder="Celular">
    <input id="contrato" placeholder="Contrato">
    <input id="data" type="date">
    <select id="periodo">
      <option>Manhã</option>
      <option>Tarde</option>
    </select>
    <input id="endereco" placeholder="Endereço">
    <button onclick="adicionarCliente()">Adicionar</button>
  </div>

  <table id="tabela">
    <thead>
      <tr>
        <th></th><th>Cliente</th><th>Celular</th><th>Contrato</th>
        <th>Data</th><th>Período</th><th>Status</th><th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script src="script.js"></script>
</body>
</html>
